<!doctype html>
<!-- @dsCard group="Brand" name="Tagline lockups" subtitle="Short / functional / wordmark / creator" viewport="700x340" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
  .row-l { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stage { background: var(--nl-ivory); border-radius: var(--radius-md); padding: 18px; display: grid; place-items: center; min-height: 130px; border: 1px solid var(--border-1); }
  .stage img { max-height: 76px; max-width: 90%; }
  .lab { font: 600 10.5px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); padding: 2px 4px 0; }
</style>
</head>
<body>
<div class="card tight">
  <div class="row-l">
    <div>
      <div class="stage"><img src="../assets/logos/short_tagline_logo_1.png" alt="short tagline"></div>
      <div class="lab" style="margin-top:6px;">+ "AI education"</div>
    </div>
    <div>
      <div class="stage"><img src="../assets/logos/functional_tagline_logo_1.png" alt="functional tagline"></div>
      <div class="lab" style="margin-top:6px;">+ "AI trainings for…"</div>
    </div>
    <div>
      <div class="stage"><img src="../assets/logos/primary_wordmark_1.png" alt="stacked wordmark"></div>
      <div class="lab" style="margin-top:6px;">Stacked wordmark</div>
    </div>
    <div>
      <div class="stage"><img src="../assets/logos/secondary_wordmark_1.png" alt="creator lockup"></div>
      <div class="lab" style="margin-top:6px;">+ "By Pietro Montaldo"</div>
    </div>
  </div>
</div>
</body></html>
