<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs · sm · md · lg · xl · pill" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
  .row-r { display: flex; gap: 12px; }
  .tile { flex: 1; aspect-ratio: 1 / 1; background: var(--nl-burgundy); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: var(--nl-ivory); }
  .tile .k { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.7; }
  .tile .v { font-family: var(--font-serif); font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="row-r">
    <div class="tile" style="border-radius: 4px;"><span class="v">xs</span><span class="k">4px</span></div>
    <div class="tile" style="border-radius: 8px;"><span class="v">sm</span><span class="k">8px</span></div>
    <div class="tile" style="border-radius: 14px;"><span class="v">md</span><span class="k">14px</span></div>
    <div class="tile" style="border-radius: 22px;"><span class="v">lg</span><span class="k">22px</span></div>
    <div class="tile" style="border-radius: 32px;"><span class="v">xl</span><span class="k">32px</span></div>
    <div class="tile" style="border-radius: 999px;"><span class="v">pill</span><span class="k">∞</span></div>
  </div>
</div>
</body></html>
