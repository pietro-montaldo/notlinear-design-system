<!doctype html>
<!-- @dsCard group="Type" name="Type scale" subtitle="Display → H1 → H2 → H3 → Body" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
  .row-t { display: grid; grid-template-columns: 64px 1fr 90px; gap: 16px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border-1); }
  .row-t:last-child { border-bottom: 0; }
  .row-t .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .row-t .name { font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em; }
  .row-t .sp { font-family: var(--font-serif); color: var(--fg-1); letter-spacing: -0.015em; line-height: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="row-t"><span class="px">72px</span><span class="sp" style="font-size:36px;">Display</span><span class="name">display</span></div>
  <div class="row-t"><span class="px">56px</span><span class="sp" style="font-size:30px;">Heading 1</span><span class="name">h1</span></div>
  <div class="row-t"><span class="px">40px</span><span class="sp" style="font-size:24px;">Heading 2</span><span class="name">h2</span></div>
  <div class="row-t"><span class="px">28px</span><span class="sp" style="font-size:18px;">Heading 3</span><span class="name">h3</span></div>
  <div class="row-t"><span class="px">17px</span><span class="sp" style="font-family: var(--font-sans); font-size:14px; font-weight: 500;">Body — long-form reading sits at 17px.</span><span class="name">body</span></div>
</div>
</body></html>
