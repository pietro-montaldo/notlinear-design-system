<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .block { background: var(--nl-burgundy); border-radius: 4px; }
  .px { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }
  .name { font: 600 9.5px/1 var(--font-sans); letter-spacing: 0.12em; color: var(--fg-2); text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="scale">
    <div class="step"><div class="block" style="width:4px;height:4px"></div><div class="px">4</div><div class="name">1</div></div>
    <div class="step"><div class="block" style="width:8px;height:8px"></div><div class="px">8</div><div class="name">2</div></div>
    <div class="step"><div class="block" style="width:12px;height:12px"></div><div class="px">12</div><div class="name">3</div></div>
    <div class="step"><div class="block" style="width:16px;height:16px"></div><div class="px">16</div><div class="name">4</div></div>
    <div class="step"><div class="block" style="width:24px;height:24px"></div><div class="px">24</div><div class="name">5</div></div>
    <div class="step"><div class="block" style="width:32px;height:32px"></div><div class="px">32</div><div class="name">6</div></div>
    <div class="step"><div class="block" style="width:48px;height:48px"></div><div class="px">48</div><div class="name">7</div></div>
    <div class="step"><div class="block" style="width:64px;height:64px"></div><div class="px">64</div><div class="name">8</div></div>
    <div class="step"><div class="block" style="width:96px;height:96px"></div><div class="px">96</div><div class="name">9</div></div>
  </div>
</div>
</body></html>
