<!doctype html>
<!-- @dsCard group="Colors" name="Secondary colors" subtitle="Lilac · Linen · Moss" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css">
<style>
  .swatch { flex: 1; min-height: 140px; border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-1); }
  .swatch .name { font-family: var(--font-serif); font-size: 22px; line-height: 1.1; }
  .swatch .hex { font-family: var(--font-mono); font-size: 12px; opacity: 0.75; }
  .lilac  { background: var(--nl-lilac);  color: var(--nl-burgundy); border-color: transparent;}
  .linen  { background: var(--nl-linen);  color: var(--nl-burgundy); border-color: transparent;}
  .moss   { background: var(--nl-moss);   color: var(--nl-ivory);    border-color: transparent;}
</style>
</head><body>
<div class="card">
  <div class="row">
    <div class="swatch lilac">
      <div class="name">Dust<br>Lilac</div>
      <div class="hex">#D5CFF5</div>
    </div>
    <div class="swatch linen">
      <div class="name">Cream<br>Linen</div>
      <div class="hex">#F4F1E2</div>
    </div>
    <div class="swatch moss">
      <div class="name">Forest<br>Moss</div>
      <div class="hex">#38422A</div>
    </div>
  </div>
</div>
</body></html>
